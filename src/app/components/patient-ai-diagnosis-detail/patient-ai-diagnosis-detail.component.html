<div class="patient-detail" *ngIf="!loading && patient">
  <div class="container">
    <!-- Header -->
    <div class="detail-header">
      <h1 class="grow text-4xl"> {{patient.name}}</h1>
      <button
        pButton
        type="button"
        label="Back to Patient Detail"
        icon="pi pi-arrow-left"
        class="back-button"
        (click)="goBack()">
      </button>
    </div>

    <!-- Summary Section -->
    <p-card class="summary-card" [style]="{ background: '#f5f9fa' }">
      <ng-template pTemplate="content">
        <div class="grid grid-cols-4 gap-4">
          <div class="w-24">
            <img [src]="patient.image" [alt]="patient.name" class="summary-image">
          </div>
          <div class="">
            <strong>Name:</strong> {{patient.name}}<br>
            <strong>Sex:</strong> {{patient.sex}}<br>
            <strong>DOB:</strong> {{patient.dob}}
          </div>
          <div class="">
            <strong>Blood Group:</strong> {{patient.bloodGroup}}<br>
            <strong>Last Check-in:</strong> {{patient.lastCheckin}}<br>
            <strong>Patient ID:</strong> {{patient.id}}
          </div>
          <div class="">
            <strong>Department:</strong> {{patient.department}}
          </div>
        </div>
      </ng-template>
    </p-card>

    <!-- Three Column Layout -->
    <div class="grid grid-cols-3 gap-8 pt-8">
      <!-- Left Column - Appointments & Prescriptions -->
      <div class="">
        <p-card class="info-card p-4" [style]="{ background: '#f5f9fa' }">
          <ng-template pTemplate="header">
            <h3 class="pt-6 pl-4 text-2xl">1</h3>
          </ng-template>
          <ng-template pTemplate="content">
            coming soon
          </ng-template>
        </p-card>

      </div>
      <!-- Middle Column - Medical History -->
      <div class="">
        <p-card class="info-card p-4" [style]="{ background: '#f5f9fa' }">
          <ng-template pTemplate="header">
            <h3 class="pt-6 pl-4 text-2xl"> 2</h3>
          </ng-template>
          <ng-template pTemplate="content">
            coming soon
          </ng-template>
        </p-card>

      </div>
      <!-- Right Column - Notes & Actions -->
      <div class="">
        <p-card class="info-card mt-3 p-4" [style]="{ background: '#f5f9fa' }">
          <ng-template pTemplate="header">
            <h3 class="pt-6 pl-4 text-2xl">3</h3>
          </ng-template>
          <ng-template pTemplate="content">
            coming soon
          </ng-template>
        </p-card>
        <!-- <p-button
          label="Add Note"
          icon="pi pi-plus"
          class="mt-3"
          (click)="addNote()">
        </p-button>
        <p-button
          label="Edit Patient"
          icon="pi pi-pencil"
          class="mt-2"
          (click)="editPatient()">
        </p-button>
        <p-button
          label="Delete Patient"
          icon="pi pi-trash"
          class="mt-2 p-button-danger"
          (click)="deletePatient()">
        </p-button> -->
      </div>
    </div>
  </div>
</div>

<div class="loading-spinner" *ngIf="loading">
  <p-progressSpinner [style]="{'width': '50px', 'height': '50px'}" />
</div>
