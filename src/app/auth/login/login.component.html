<div class="login-container">
  <div class="login-wrapper">
    <p-card>
      <ng-template pTemplate="header">
        <div class="login-header">
          <i class="pi pi-user-md"></i>
          <h2>Doctor Login</h2>
          <p>Access Patient Management System</p>
        </div>
      </ng-template>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            pInputText
            [(ngModel)]="loginData.username"
            name="username"
            placeholder="Enter username"
            required
            class="w-full" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <p-password
            [(ngModel)]="loginData.password"
            name="password"
            placeholder="Enter password"
            [feedback]="false"
            [toggleMask]="true"
            required
            styleClass="w-full">
          </p-password>
        </div>

        <div class="field">
          <label for="specialty">Specialty</label>
          <p-dropdown
            [(ngModel)]="loginData.specialty"
            name="specialty"
            [options]="specialties"
            placeholder="Select Specialty"
            required
            styleClass="w-full">
          </p-dropdown>
        </div>

        <p-message
          *ngIf="errorMessage"
          severity="error"
          [text]="errorMessage"
          styleClass="w-full mb-3">
        </p-message>

        <p-button
          type="submit"
          label="Login"
          icon="pi pi-sign-in"
          styleClass="w-full"
          [disabled]="!loginForm.form.valid">
        </p-button>
      </form>
    </p-card>
  </div>
</div>
