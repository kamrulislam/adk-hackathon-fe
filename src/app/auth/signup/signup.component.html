<h1 class="text-center mt-5">Signup</h1>

<form [formGroup]="form" (submit)="onSubmit()" class="w-25 mx-auto">
    <!-- Email -->
    <div class="form-input">
        <label
            >Your email or phone number
            <span class="text-danger">*</span></label
        >
        <input
            type="email"
            pInputText
            formControlName="email"
            placeholder="Enter Here"
            class="mt-2"
        />
        <div
            *ngIf="
                form.controls['email'].invalid &&
                (form.controls['email'].dirty || form.controls['email'].touched)
            "
            class="error"
        >
            <div>Please enter a valid email</div>
        </div>
    </div>

    <!-- password -->
    <div class="p-fluid password">
        <label>Password <span class="text-danger mb-2">*</span> </label>

        <p-password
            formControlName="password"
            [toggleMask]="true"
            [feedback]="true"
        ></p-password>
        <div
            *ngIf="
                form.controls['password'].invalid &&
                (form.controls['password'].dirty ||
                    form.controls['password'].touched)
            "
            class="error"
        >
            Password is required
        </div>
    </div>

    <!-- button -->
    <button
        pButton
        class="text-center w-100 mt-4"
        type="submit"
        [disabled]="form.invalid || isSubmitLoading"
    >
        <div
            class="d-flex py-1 justify-content-center align-items-center w-100"
        >
            <span>Create an account</span>
        </div>
    </button>
    <p-progressBar
        mode="indeterminate"
        [style]="{ height: '4px' }"
        *ngIf="isSubmitLoading"
    ></p-progressBar>

    <button
        pButton
        pRipple
        label="Login"
        [routerLink]="['/auth']"
        type="button"
        class="p-button-outlined p-button-success w-100 my-5"
    ></button>
</form>
